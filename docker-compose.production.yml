# ===========================================
# Production Docker Compose Configuration
# Includes: Load balancing, resource limits, monitoring
# ===========================================
version: '3.8'

services:
  # Nginx Load Balancer
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_cache:/var/cache/nginx
    depends_on:
      - backend_1
      - backend_2
    restart: unless-stopped
    networks:
      - app_network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

  # Backend Instance 1
  backend_1:
    build:
      context: .
      dockerfile: Dockerfile.production
    environment:
      - FLASK_ENV=production
      - PYTHONPATH=/app/backend
      - PORT=8000
      - WORKERS=4
      - TIMEOUT=120
      - REDIS_URL=redis://redis:6379
      - ENABLE_CACHING=true
      - ENABLE_RATE_LIMITING=true
      - ENABLE_CSRF_PROTECTION=true
    env_file:
      - .env.production
    volumes:
      - backend_logs_1:/app/backend/logs
      - backend_data:/app/backend/data:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - app_network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Backend Instance 2 (for load balancing)
  backend_2:
    build:
      context: .
      dockerfile: Dockerfile.production
    environment:
      - FLASK_ENV=production
      - PYTHONPATH=/app/backend
      - PORT=8000
      - WORKERS=4
      - TIMEOUT=120
      - REDIS_URL=redis://redis:6379
      - ENABLE_CACHING=true
      - ENABLE_RATE_LIMITING=true
      - ENABLE_CSRF_PROTECTION=true
    env_file:
      - .env.production
    volumes:
      - backend_logs_2:/app/backend/logs
      - backend_data:/app/backend/data:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - app_network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Redis Cache (Production)
  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --tcp-keepalive 60
      --timeout 300
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks:
      - app_network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # PostgreSQL Database (Production - Optional)
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=bhriguwelt
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app_network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Prometheus Monitoring (Optional)
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"
    restart: unless-stopped
    networks:
      - app_network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

networks:
  app_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  redis_data:
    driver: local
  postgres_data:
    driver: local
  backend_logs_1:
    driver: local
  backend_logs_2:
    driver: local
  backend_data:
    driver: local
  nginx_cache:
    driver: local
  prometheus_data:
    driver: local
