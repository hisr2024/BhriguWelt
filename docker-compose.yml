version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      BHRIGUWELT_ADMIN_TOKEN: ${BHRIGUWELT_ADMIN_TOKEN:-}
    volumes:
      - ./backend:/app/backend
      - ./start.sh:/app/start.sh
    command: ["bash", "/app/start.sh"]

  frontend:
    image: node:18-alpine
    working_dir: /app
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_BACKEND_URL: http://localhost:8000
      NEXT_PUBLIC_BACKEND_FALLBACK_URL: ""
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: >
      sh -c "npm install && npm run dev -- --hostname 0.0.0.0 --port 3000"

volumes:
  frontend_node_modules:
