providers = ["python"]

[variables]
PYTHON_VERSION = "3.11"
PYTHONPATH = "/app/src"

[phases.setup]
nixPkgs = ["python311", "python311Packages.pip"]

[phases.install]
cmds = [
  "cd backend && python -m pip install --upgrade pip",
  "cd backend && python -m pip install -r requirements.txt"
]

[start]
cmd = "bash /app/start.sh"
