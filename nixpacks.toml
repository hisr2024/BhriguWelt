providers = ["python"]

[variables]
PYTHON_VERSION = "3.11"
PYTHONPATH = "/app/backend"

[phases.setup]
nixPkgs = ["python311", "python311Packages.pip"]

[phases.install]
cmds = [
  "cd /app/backend && python -m pip install --upgrade pip",
  "cd /app/backend && python -m pip install -r requirements.txt"
]

[start]
cmd = "cd /app/backend && gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120"
