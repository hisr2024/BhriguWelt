name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - "docs/**"
      - "render.yaml"
      - "nixpacks.toml"
      - "start.sh"
  pull_request:
    paths:
      - "backend/**"
      - "docs/**"
      - "render.yaml"
      - "nixpacks.toml"
      - "start.sh"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      - name: Verify Python version
        run: |
          python - <<'PY'
          import pathlib
          import sys

          expected = pathlib.Path("runtime.txt").read_text().strip().removeprefix("python-")
          actual = sys.version.split()[0]
          if actual != expected:
              raise SystemExit(f"Expected Python {expected}, got {actual}")
          print(f"Python version OK: {actual}")
          PY

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run pytest
        working-directory: backend
        env:
          PYTHONPATH: src
        run: pytest --cov=src --cov-report=xml --cov-fail-under=95

      - name: Run mypy type checking
        working-directory: backend
        run: mypy --config-file=mypy.ini routes services middleware utils app.py models.py

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      - name: Verify Python version
        run: |
          python - <<'PY'
          import pathlib
          import sys

          expected = pathlib.Path("runtime.txt").read_text().strip().removeprefix("python-")
          actual = sys.version.split()[0]
          if actual != expected:
              raise SystemExit(f"Expected Python {expected}, got {actual}")
          print(f"Python version OK: {actual}")
          PY

      - name: Install security tooling
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pip install bandit safety

      - name: Bandit scan
        working-directory: backend
        env:
          PYTHONPATH: src
        run: bandit -r src -lll

      - name: Safety dependency scan
        working-directory: backend
        run: safety check -r requirements.txt -r requirements-dev.txt --full-report
