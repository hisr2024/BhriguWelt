name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - "docs/**"
      - "render.yaml"
      - "nixpacks.toml"
      - "start.sh"
  pull_request:
    paths:
      - "backend/**"
      - "docs/**"
      - "render.yaml"
      - "nixpacks.toml"
      - "start.sh"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run pytest
        working-directory: backend
        env:
          PYTHONPATH: src
        run: pytest
