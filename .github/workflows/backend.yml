name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - "docs/**"
      - "render.yaml"
      - "nixpacks.toml"
      - "start.sh"
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/**"
      - "docs/**"
      - "render.yaml"
      - "nixpacks.toml"
      - "start.sh"

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: "pip"
          cache-dependency-path: backend/requirements*.txt

      - name: Verify Python version
        run: |
          python - <<'PY'
          import pathlib
          import sys

          expected = pathlib.Path("runtime.txt").read_text().strip().removeprefix("python-")
          actual = sys.version.split()[0]
          if actual != expected:
              raise SystemExit(f"Expected Python {expected}, got {actual}")
          print(f"Python version OK: {actual}")
          PY

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pip install pytest pytest-cov pytest-mock fakeredis

      - name: Run pytest with coverage
        working-directory: backend
        env:
          # Redis configuration
          REDIS_URL: redis://localhost:6379
          REDIS_ENABLED: "true"
          REDIS_MAX_CONNECTIONS: "10"
          REDIS_SOCKET_TIMEOUT: "5"
          REDIS_CONNECT_TIMEOUT: "5"
          REDIS_CIRCUIT_BREAKER_THRESHOLD: "5"
          REDIS_CIRCUIT_BREAKER_TIMEOUT: "60"

          # Flask configuration
          FLASK_ENV: testing
          SECRET_KEY: test-secret-key-for-ci
          JWT_SECRET_KEY: test-jwt-secret-for-ci

          # OpenAI configuration (test values)
          OPENAI_API_KEY: sk-test-key-do-not-use
          OPENAI_MODEL: gpt-3.5-turbo
          OPENAI_MAX_TOKENS: "512"

          # Quota and cost configuration
          USER_DAILY_TOKEN_LIMIT: "100000"
          PER_REQUEST_COST_LIMIT: "0.30"
          OPENAI_COST_PER_1K: "0.002"

          # Cache configuration
          CACHE_TTL: "3600"
          PREDICTION_CACHE_ENABLED: "true"

          # Testing flag
          TESTING: "true"

          # Python path
          PYTHONPATH: .
        run: |
          pytest tests/ \
            --cov=. \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=45 \
            -v \
            --tb=short \
            --ignore=tests/fixtures

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./backend/coverage.xml
          flags: backend
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Run mypy type checking
        working-directory: backend
        continue-on-error: true
        run: |
          mypy --config-file=mypy.ini \
            routes \
            services \
            middleware \
            utils \
            app.py \
            models.py \
            --ignore-missing-imports \
            || true

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: "pip"
          cache-dependency-path: backend/requirements*.txt

      - name: Verify Python version
        run: |
          python - <<'PY'
          import pathlib
          import sys

          expected = pathlib.Path("runtime.txt").read_text().strip().removeprefix("python-")
          actual = sys.version.split()[0]
          if actual != expected:
              raise SystemExit(f"Expected Python {expected}, got {actual}")
          print(f"Python version OK: {actual}")
          PY

      - name: Install security tooling
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pip install bandit safety

      - name: Bandit security scan
        working-directory: backend
        continue-on-error: true
        run: |
          bandit -r . \
            -lll \
            --exclude tests,venv,.venv \
            -f json \
            -o bandit-report.json \
            || true
          # Display summary
          bandit -r . \
            -lll \
            --exclude tests,venv,.venv \
            || true

      - name: Safety dependency scan
        working-directory: backend
        continue-on-error: true
        run: |
          safety check \
            -r requirements.txt \
            -r requirements-dev.txt \
            --full-report \
            || true

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8 black isort

      - name: Run flake8
        working-directory: backend
        continue-on-error: true
        run: |
          flake8 . \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics \
            --exclude=tests,venv,.venv,__pycache__

      - name: Check formatting with black
        working-directory: backend
        continue-on-error: true
        run: |
          black --check --diff . \
            --exclude='(tests|venv|\.venv|__pycache__)' \
            || true

      - name: Check import ordering with isort
        working-directory: backend
        continue-on-error: true
        run: |
          isort --check-only --diff . \
            --skip tests \
            --skip venv \
            --skip .venv \
            || true
