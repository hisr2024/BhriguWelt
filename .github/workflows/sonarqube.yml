name: SonarQube

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pip install pytest pytest-cov pytest-mock fakeredis

      - name: Run backend tests with coverage
        working-directory: backend
        env:
          PYTHONPATH: "."
          FLASK_ENV: testing
          TESTING: "true"
        run: pytest tests/ --cov=. --cov-report=xml --ignore=tests/fixtures

      - name: SonarQube scan
        # Runs only when a SonarQube server is configured for this repo;
        # otherwise the job still validates tests+coverage and passes.
        if: ${{ secrets.SONAR_TOKEN != '' && secrets.SONAR_HOST_URL != '' }}
        uses: sonarsource/sonarqube-scan-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: SonarQube scan skipped notice
        if: ${{ secrets.SONAR_TOKEN == '' || secrets.SONAR_HOST_URL == '' }}
        run: echo "SONAR_TOKEN / SONAR_HOST_URL not configured - scan skipped."
