name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        # Requires the repository's Dependency Graph to be enabled
        # (Settings -> Advanced Security -> Dependency graph). Until then the
        # action errors out; keep it advisory instead of blocking merges.
        continue-on-error: true
        with:
          fail-on-severity: high
