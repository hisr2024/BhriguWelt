name: Frontend CI

on:
  push:
    paths:
      - "frontend/**"
      - "docs/**"
  pull_request:
    paths:
      - "frontend/**"
      - "docs/**"

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Verify Node version
        run: |
          node -e "const fs=require('fs');const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));const expected=pkg.engines?.node; if(!expected){throw new Error('Missing engines.node in package.json');} const expectedMajor=(expected.match(/\\d+/)||[])[0]; const actualMajor=process.versions.node.split('.')[0]; if(expectedMajor!==actualMajor){throw new Error(`Expected Node ${expected}, got ${process.versions.node}`);} console.log(`Node version OK: ${process.versions.node}`);"

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Run lint
        working-directory: frontend
        env:
          NEXT_PUBLIC_BACKEND_URL: "http://localhost:8000"
        run: npm run lint

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit
