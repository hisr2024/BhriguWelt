name: Frontend CI

on:
  push:
    paths:
      - "frontend/**"
      - "docs/**"
  pull_request:
    paths:
      - "frontend/**"
      - "docs/**"

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.11.0"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Verify toolchain compatibility
        run: |
          node -e "const pkg=require('./package.json'); const expectedNode=pkg.engines.node; const expectedNpm=pkg.engines.npm; const actualNode=process.version.replace('v',''); const {execSync}=require('child_process'); const actualNpm=execSync('npm --version').toString().trim(); if (actualNode !== expectedNode) { throw new Error(`Node version ${actualNode} does not match required ${expectedNode}`); } if (actualNpm !== expectedNpm) { throw new Error(`npm version ${actualNpm} does not match required ${expectedNpm}`); } console.log(`Node ${actualNode} and npm ${actualNpm} match package.json engines.`);"

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Run lint
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8000"
        run: npm run lint

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit
