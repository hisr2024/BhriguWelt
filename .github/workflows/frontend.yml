name: Frontend CI

on:
  push:
    paths:
      - "frontend/**"
      - "docs/**"
  pull_request:
    paths:
      - "frontend/**"
      - "docs/**"

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: "http://localhost:8000"
      NEXT_PUBLIC_BACKEND_URL: "http://localhost:8000"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.11.0"

      - name: Upgrade npm
        run: npm install -g npm@11.0.0

      - name: Verify toolchain compatibility
        run: |
          node -e "const pkg=require('./package.json'); const expectedNode=pkg.engines.node; const expectedNpm=pkg.engines.npm; const actualNode=process.version.replace('v',''); const {execSync}=require('child_process'); const actualNpm=execSync('npm --version').toString().trim(); const parseVersion=(value)=>value.replace('>=','').split('.').map(Number); const [nodeMajor]=parseVersion(actualNode); const [npmMajor]=parseVersion(actualNpm); const [expectedNodeMajor]=parseVersion(expectedNode); const [expectedNpmMajor]=parseVersion(expectedNpm); if (nodeMajor < expectedNodeMajor) { throw new Error(`Node version ${actualNode} does not satisfy required ${expectedNode}`); } if (npmMajor < expectedNpmMajor) { throw new Error(`npm version ${actualNpm} does not satisfy required ${expectedNpm}`); } console.log(`Node ${actualNode} and npm ${actualNpm} satisfy package.json engines.`);"

      - name: Validate environment variables
        run: |
          node -e "const required=['NEXT_PUBLIC_API_URL','NEXT_PUBLIC_BACKEND_URL']; const missing=required.filter(key=>!process.env[key]); if (missing.length) { throw new Error(`Missing required env vars: ${missing.join(', ')}`); } console.log('Required env vars present:', required.join(', '));"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --workspaces=false

      - name: Run lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: "http://localhost:8000"
      NEXT_PUBLIC_BACKEND_URL: "http://localhost:8000"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.11.0"

      - name: Upgrade npm
        run: npm install -g npm@11.0.0

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --workspaces=false

      - name: Run unit tests
        run: npm test -- --passWithNoTests

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: "http://localhost:8000"
      NEXT_PUBLIC_BACKEND_URL: "http://localhost:8000"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.11.0"

      - name: Upgrade npm
        run: npm install -g npm@11.0.0

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --workspaces=false

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run E2E tests
        run: npx playwright test --reporter=list

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: "http://localhost:8000"
      NEXT_PUBLIC_BACKEND_URL: "http://localhost:8000"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.11.0"

      - name: Upgrade npm
        run: npm install -g npm@11.0.0

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --workspaces=false

      - name: Run build
        run: npm run build

      - name: Verify build output
        run: test -d .next
