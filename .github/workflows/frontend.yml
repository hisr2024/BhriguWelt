name: Frontend CI

# This repository is an npm workspace: the single source-of-truth lockfile
# lives at the repo root and hoists the frontend workspace's dependencies.
# All installs therefore run at the root — `npm ci` inside frontend/ resolves
# the workspace root anyway and previously installed only the root's own
# dependencies (no typescript, no playwright), breaking every job.

on:
  push:
    paths:
      - "frontend/**"
      - "docs/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "docs/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/frontend.yml"

env:
  NEXT_PUBLIC_API_URL: "http://localhost:8000"
  NEXT_PUBLIC_BACKEND_URL: "http://localhost:8000"

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.11.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.11.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run unit tests
        run: npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.11.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests (smoke, chromium)
        # The interactive prediction/profile specs require a running backend
        # service and are exercised locally; CI validates that the app boots,
        # renders, and navigates cleanly.
        run: npx playwright test --config=frontend/playwright.config.ts smoke.spec.ts --project=chromium --reporter=list

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.11.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run build
        run: npm run build

      - name: Verify build output
        run: test -d frontend/.next
