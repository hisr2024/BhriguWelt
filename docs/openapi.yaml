openapi: 3.1.0
info:
  title: BhriguWelt API
  version: 1.0.0
  description: |
    Lightweight HTTP interface for the Bhrigu Samhita engines. The server is
    intentionally dependency-free and aligns with the CLI validation rules.
servers:
  - url: http://localhost:8000
    description: Local development
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: Service is reachable
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  source:
                    type: string
  /calendar:
    post:
      summary: Convert Gregorian birth details to Śaka calendar context
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalendarRequest'
            examples:
              valid:
                summary: Valid calendar conversion
                value:
                  birth_date: "2024-03-21"
                  birth_time: "05:30"
                  birth_place: "Prayagraj, Bharat"
      responses:
        "200":
          description: Calendar conversion payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarResponse'
              examples:
                sample:
                  summary: Successful conversion
                  value:
                    saka_date:
                      year: 1946
                      month: 1
                      day: 1
                    nakshatra: Revati
                    conversion_factor_years: 78
  /horoscope:
    post:
      summary: Generate a full horoscope report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HoroscopeRequest'
            examples:
              primary:
                summary: Complete seeker payload
                value:
                  name: "Asha"
                  birth_date: "1995-05-18"
                  birth_time: "14:45"
                  birth_place: "Varanasi, Bharat"
                  lunar_tithi: 5
                  moon_element: water
                  mars_house: 10
                  saturn_house: 2
                  venus_house: 2
                  rahu_aspects_ascendant: true
                  consent_for_date_predictions: true
      responses:
        "200":
          description: Horoscope report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HoroscopeResponse'
              examples:
                charts:
                  summary: Rich horoscope payload (charts + dashas)
                  value:
                    name: "Asha"
                    karmic_epoch: "Moral Reset"
                    weights:
                      dharma: 0.78
                      artha: 0.65
                    principles:
                      - sutra: 108
                        folio: "B3"
                        summary: "Strength from disciplined Saturn"
                    remedies:
                      - title: "Water fasting on Ekadashi"
                        description: "Observe light fasting to calm lunar tides."
                    past_life_insights:
                      - theme: "Mentorship karma"
                        score: 0.71
                    future_trajectories:
                      - headline: "Creative partnerships flourish"
                        timeframe: "Q3 2024"
                    interpretation: "Balance Mars intensity with Venusian compassion."
                    rashi_chart:
                      - index: 1
                        sign: Aries
                        occupants: ["Mars"]
                        bhrigu_notes: ["Placeholder chart generated; verify birth details for precise mapping."]
                    bhava_chart:
                      - index: 1
                        sign: Taurus
                        occupants: ["—"]
                        bhrigu_notes: []
                    dashas:
                      - lord: "Ketu"
                        start: "1995-05-18"
                        end: "2002-05-18"
                        anchor_rule: "Aligned with natal snapshot"
        "400":
          description: Validation error
          content:
            application/json:
              examples:
                bad_time:
                  summary: Time formatted incorrectly
                  value:
                    message: "Invalid birth time: use 24h HH:MM (00–23 for hours, 00–59 for minutes)"
  /past-life:
    post:
      summary: Summarize past-life insights
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HoroscopeRequest'
            examples:
              seeker:
                summary: Same payload as /horoscope
                value:
                  name: "Asha"
                  birth_date: "1995-05-18"
                  birth_time: "14:45"
                  birth_place: "Varanasi, Bharat"
                  lunar_tithi: 5
                  moon_element: water
                  mars_house: 10
                  saturn_house: 2
                  venus_house: 2
                  rahu_aspects_ascendant: true
      responses:
        "200":
          description: Past-life narrative
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PastLifeResponse'
              examples:
                sample:
                  summary: Insights mapped to karmic themes
                  value:
                    name: "Asha"
                    insights:
                      - theme: "Service"
                        score: 0.64
                        guidance: "Continue volunteer efforts in education."
                    interpretation: "Past nurturing roles echo in current life."
  /future:
    post:
      summary: Generate future trajectories
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HoroscopeRequest'
            examples:
              seeker:
                summary: Same payload as /horoscope
                value:
                  name: "Asha"
                  birth_date: "1995-05-18"
                  birth_time: "14:45"
                  birth_place: "Varanasi, Bharat"
                  lunar_tithi: 5
                  moon_element: water
                  mars_house: 10
                  saturn_house: 2
                  venus_house: 2
                  rahu_aspects_ascendant: true
      responses:
        "200":
          description: Future directives
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FutureResponse'
  /matchmaking:
    post:
      summary: Modern matchmaking guidance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                primary:
                  $ref: '#/components/schemas/HoroscopeRequest'
                partner:
                  $ref: '#/components/schemas/HoroscopeRequest'
                modern_preferences:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: Compatibility insights
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchmakingResponse'
  /feedback:
    post:
      summary: Store an accuracy rating from the seeker
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackRequest'
      responses:
        "201":
          description: Feedback persisted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackEntry'
  /feedback/quarterly:
    get:
      summary: Retrieve quarterly accuracy rollups
      responses:
        "200":
          description: Quarterly averages and highlighted notes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuarterlySummary'
components:
  schemas:
    HoroscopeRequest:
      type: object
      required:
        - name
        - birth_date
        - birth_time
        - birth_place
        - lunar_tithi
        - moon_element
        - mars_house
        - saturn_house
        - venus_house
      properties:
        name:
          type: string
        birth_date:
          type: string
          format: date
        birth_time:
          type: string
          pattern: "^\\d{2}:\\d{2}$"
        birth_place:
          type: string
        lunar_tithi:
          type: integer
          minimum: 1
          maximum: 30
        moon_element:
          type: string
          enum: [water, fire, air, earth, ether]
        mars_house:
          type: integer
          minimum: 1
          maximum: 12
        saturn_house:
          type: integer
          minimum: 1
          maximum: 12
        venus_house:
          type: integer
          minimum: 1
          maximum: 12
        rahu_aspects_ascendant:
          type: boolean
    CalendarRequest:
      type: object
      required:
        - birth_date
        - birth_time
        - birth_place
      properties:
        birth_date:
          type: string
          format: date
        birth_time:
          type: string
          pattern: "^\\d{2}:\\d{2}$"
        birth_place:
          type: string
    CalendarResponse:
      type: object
      properties:
        saka_date:
          type: object
        nakshatra:
          type: string
        conversion_factor_years:
          type: integer
    HoroscopeResponse:
      type: object
      properties:
        name:
          type: string
        karmic_epoch:
          type: string
        weights:
          type: object
        principles:
          type: array
          items:
            type: object
        remedies:
          type: array
          items:
            type: object
        past_life_insights:
          type: array
          items:
            type: object
        future_trajectories:
          type: array
          items:
            type: object
    PastLifeResponse:
      type: object
      properties:
        name:
          type: string
        insights:
          type: array
          items:
            type: object
    FutureResponse:
      type: object
      properties:
        name:
          type: string
        trajectories:
          type: array
          items:
            type: object
    MatchmakingResponse:
      type: object
      properties:
        primary_name:
          type: string
        partner_name:
          type: string
        compatibility:
          type: object
          properties:
            compatibility_index:
              type: number
            breakdown:
              type: array
              items:
                type: object
            modern_highlights:
              type: array
              items:
                type: string
    FeedbackRequest:
      type: object
      required:
        - engine
        - rating
      properties:
        engine:
          type: string
          enum: [horoscope, past-life, future, matchmaking, calendar, transits]
        rating:
          type: integer
          minimum: 1
          maximum: 5
        seeker_name:
          type: string
        notes:
          type: string
    FeedbackEntry:
      type: object
      properties:
        id:
          type: integer
        engine:
          type: string
        rating:
          type: integer
        seeker_name:
          type: string
        notes:
          type: string
        created_at:
          type: string
    FeedbackNote:
      type: object
      properties:
        seeker_name:
          type: string
        rating:
          type: integer
        notes:
          type: string
        created_at:
          type: string
    QuarterlyReview:
      type: object
      properties:
        label:
          type: string
        average_rating:
          type: number
        submissions:
          type: integer
        promoters:
          type: integer
        recent_notes:
          type: array
          items:
            $ref: '#/components/schemas/FeedbackNote'
    QuarterlySummary:
      type: object
      properties:
        quarters:
          type: array
          items:
            $ref: '#/components/schemas/QuarterlyReview'
