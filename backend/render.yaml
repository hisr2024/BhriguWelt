services:
  - type: web
    name: bhriguwelt-api
    runtime: python
    plan: starter
    rootDirectory: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 4 --timeout 120
    envVars:
      # Flask Configuration
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true

      # AI provider: Sarvam AI (set SARVAM_API_KEY) or OpenAI (set OPENAI_API_KEY).
      # With only a Sarvam key, OPENAI_MODEL/OPENAI_BASE_URL below are ignored.
      - key: SARVAM_API_KEY
        sync: false
      - key: SARVAM_MODEL
        value: sarvam-105b
      - key: SARVAM_REASONING_EFFORT
        value: low

      # OpenAI Configuration (only used when OPENAI_API_KEY is set)
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://api.openai.com/v1
      - key: OPENAI_MODEL
        value: gpt-3.5-turbo
      - key: OPENAI_MAX_TOKENS
        value: "512"
      - key: OPENAI_TEMPERATURE
        value: "0.6"
      - key: OPENAI_PROMPT_TOKEN_BUDGET
        value: "2000"
      - key: OPENAI_USE_JSON_FORMAT
        value: "true"

      # Quota and Cost Management
      - key: USER_DAILY_TOKEN_LIMIT
        value: "50000"
      - key: PER_REQUEST_COST_LIMIT
        value: "0.30"
      - key: OPENAI_COST_PER_1K
        value: "0.002"

      # Caching Configuration
      - key: CACHE_TTL
        value: "3600"
      - key: PREDICTION_CACHE_ENABLED
        value: "true"

      # Redis Configuration
      - key: REDIS_ENABLED
        value: "true"
      - key: REDIS_URL
        fromDatabase:
          name: bhriguwelt-redis
          property: connectionString
      - key: REDIS_MAX_CONNECTIONS
        value: "50"
      - key: REDIS_SOCKET_TIMEOUT
        value: "5"
      - key: REDIS_CONNECT_TIMEOUT
        value: "5"
      - key: REDIS_CIRCUIT_BREAKER_THRESHOLD
        value: "5"
      - key: REDIS_CIRCUIT_BREAKER_TIMEOUT
        value: "60"
      - key: REDIS_RECONNECT_BACKOFF
        value: "30"
      - key: REDIS_MAX_RECONNECT_ATTEMPTS
        value: "10"

      # Premium subscriptions. Nothing is locked until BILLING_ENFORCE=true.
      - key: BILLING_ENFORCE
        value: "false"
      - key: PREMIUM_TRIAL_DAYS
        value: "7"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_MONTHLY
        sync: false
      - key: STRIPE_PRICE_YEARLY
        sync: false
      # Stripe as merchant of record (handles VAT/GST); set false to sell directly.
      - key: STRIPE_MANAGED_PAYMENTS
        value: "true"
      - key: GOOGLE_PLAY_PACKAGE
        value: app.bhriguwelt.twa
      - key: GOOGLE_PLAY_SERVICE_ACCOUNT_JSON
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: FROM_EMAIL
        value: noreply@bhriguwelt.app

      # Read-aloud voice: sarvam (Bulbul, uses SARVAM_API_KEY) or svara
      # (Kenpath svara-TTS on your own GPU server; falls back to Sarvam).
      - key: TTS_ENGINE
        value: sarvam
      - key: TTS_SARVAM_MODEL
        value: bulbul:v3
      - key: VOICE_MONTHLY_MINUTES
        value: "30"
      - key: SVARA_TTS_URL
        sync: false
      - key: SVARA_TTS_KEY
        sync: false

      # Frontend URL (for CORS)
      - key: FRONTEND_URL
        value: https://bhrigu-welt.vercel.app

      # Core Wisdom Path
      - key: CORE_WISDOM_PATH
        value: /opt/render/project/src/core_wisdom

      # Logging Configuration
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json

      # Security
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: RATE_LIMIT_DEFAULT
        value: "100/hour"

    healthCheckPath: /health
    autoDeploy: true

  - type: redis
    name: bhriguwelt-redis
    plan: starter
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []
