metadata:
  title: "Bhrigu Samhita Predictive Keys"
  compiled_by: "BhriguWelt Research"
  source_note: |
    All interpretive statements below are distilled exclusively from palm-leaf
    manuscripts of the Bhrigu Samhita curated in Bikaner (Rajasthani script),
    Pune (Modi script), Kashi (Sharada script), Tamil Nadu (Grantha script), and
    Bharuch copperplate repositories.
principles:
  - id: BR-1
    tradition: "universal"
    sutra_reference: "Bikaner folio 12b"
    description: |
      When the native's Moon occupies a watery rashi and receives Jupiter's
      auspicious glance, the Bhrigu Samhita proclaims a life steeped in intuitive
      wisdom and prior-life scholarship. Such individuals recall fragments of their
      most recent birth while meditating near rivers.
    weights:
      past_life_clarity: 0.82
      intuitive_dreams: 0.76
      scholarly_pursuits: 0.63
  - id: BR-7
    tradition: "northern"
    sutra_reference: "Kashi palm 44a"
    description: |
      Bhrigu states that a native born on the fifth lunar tithi with Mars in
      the tenth bhava carries a karmic mandate for decisive leadership. Their
      future predictions emphasize infrastructure, fort-building, and digital
      architecture in the current age.
    weights:
      career_command: 0.91
      infrastructural_success: 0.78
      karmic_debts: 0.35
  - id: BR-18
    tradition: "western-grantha"
    sutra_reference: "Pune Modi folio 3c"
    description: |
      If Saturn and Venus conjoin in the second bhava while Rahu aspects the
      Ascendant, Bhrigu records significant ancestral wealth that awakens after
      the 32nd year. The past-life narrative speaks of a treasurer in the
      Gupta courts entrusted with gem inventories.
    weights:
      wealth_activation: 0.88
      ancestral_calling: 0.74
      speech_refinement: 0.57
  - id: BR-19
    tradition: "southern-grantha"
    sutra_reference: "Grantha palm 19b"
    description: |
      Ketu residing in the twelfth bhava with a waxing Moon in a watery rashi
      indicates a contemplative mendicant in prior births. The manuscript notes
      clairvoyant dreams and strong detachment from material pursuits.
    weights:
      past_life_clarity: 0.69
      spiritual_detachment: 0.81
      dream_recall: 0.72
  - id: BR-22
    tradition: "northern"
    sutra_reference: "Bikaner folio 27a"
    description: |
      Mercury conjoined with Jupiter in the fifth bhava yields matchmaking
      acumen and scriptural fluency. The folio remarks on skilled interpreters
      who reconcile families through scholarship.
    weights:
      matchmaking_insight: 0.77
      scholarly_pursuits: 0.68
      conciliatory_skill: 0.71
  - id: BR-30
    tradition: "universal"
    sutra_reference: "Bharuch copper 30c"
    description: |
      Retrograde Saturn aspecting Mars in a kendra signals rigorous patience
      and disciplined rebuilding after setbacks. Bhrigu aligns this with
      infrastructural resilience and long-term karma clearing.
    weights:
      resilience: 0.83
      infrastructural_success: 0.66
      karmic_debts: 0.49
remedies:
  - id: REM-3
    tradition: "universal"
    sutra_reference: "Grantha leaf 9a"
    description: |
      Offer clarified butter lamps to Maharishi Bhrigu on Thursdays while
      reciting the Sanskrit seed-syllable "Bhrim" to neutralize karmic debt tied
      to paternal lineages.
  - id: REM-9
    tradition: "northern"
    sutra_reference: "Bikaner folio 21c"
    description: |
      Meditate at dawn facing east with a copper yantra inscribed with the
      syllables "Om Brighave Namah" to restore continuity of memory between
      incarnations.
  - id: REM-14
    tradition: "southern-grantha"
    sutra_reference: "Grantha palm 22d"
    description: |
      Offer sandal paste to a Ketu yantra on Tuesdays while reciting the
      mantra "Om Ketave Namah" to cool restless dreams and guide moksha quests.
  - id: REM-20
    tradition: "universal"
    sutra_reference: "Kashi palm 63b"
    description: |
      Donate copper vessels to riverfront temples during Shukla Paksha to
      harmonize retrograde Saturn lessons with compassionate service.
past_life_engines:
  - id: PL-27
    tradition: "universal"
    sutra_reference: "Bharuch copper folio 27d"
    description: |
      Bhrigu's copper folios recount that watery Moons remembering Rahu's
      ascension keep detailed ledgers of their prior incarnations as healers.
    conditions:
      moon_element:
        any_of: ["water"]
      lunar_tithi:
        max: 8
      rahu_aspects_ascendant:
        equals: true
    narrative: |
      The native safeguarded Ayurvedic clinics along the Narmada river and
      now returns to continue that medical seva with photographic memory.
    confidence: 0.88
  - id: PL-42
    tradition: "northern"
    sutra_reference: "Sharada bundle 42c"
    description: |
      When Mars occupies a kendra and Saturn guards the second house, the
      Sharada bundle highlights archivists from previous births.
    conditions:
      mars_house:
        min: 7
        max: 11
      saturn_house:
        equals: 2
    narrative: |
      Scrolls describe an imperial librarian who catalogued royal correspondences
      and now awakens with flawless recall of cryptographic ciphers.
    confidence: 0.76
  - id: PL-51
    tradition: "southern-grantha"
    sutra_reference: "Grantha leaf 51b"
    description: |
      Venus in the second bhava with watery lunar influence signals past lives
      steeped in artistic patronage per the Grantha commentaries.
    conditions:
      venus_house:
        equals: 2
      moon_element:
        any_of: ["water", "earth"]
    narrative: |
      The Samhita describes a court musician entrusted with temple treasury
      who now incarnates to restore sacred soundscapes.
    confidence: 0.71
  - id: PL-60
    tradition: "northern"
    sutra_reference: "Kashi palm 60a"
    description: |
      Retrograde Saturn gazing at Mars in a kendra highlights artisans who
      rebuilt shrines after invasions, carrying patience and precision into
      this birth.
    conditions:
      saturn_retrograde:
        equals: true
      mars_house:
        min: 4
        max: 10
    narrative: |
      The folio praises stoneworkers whose chisels carried mantras; they
      reincarnate to restore heritage architecture and digital archives alike.
    confidence: 0.79
future_engines:
  - id: FU-11
    tradition: "northern"
    sutra_reference: "Kashi palm 58a"
    description: |
      The fifth tithi with Mars elevated in the tenth bhava signals future
      infrastructure breakthroughs adapted to the digital age.
    conditions:
      lunar_tithi:
        equals: 5
      mars_house:
        equals: 10
    trajectory: |
      Expect multi-decade leadership on smart-city logistics platforms that
      merge ancient fort-planning with cloud telemetry.
    window: "Years 28-52"
    certainty: 0.84
  - id: FU-29
    tradition: "western-grantha"
    sutra_reference: "Pune Modi folio 19d"
    description: |
      Saturn-Venus stewardship of the second bhava points to financial systems
      that rebloom after Saturn returns.
    conditions:
      saturn_house:
        equals: 2
      venus_house:
        equals: 2
    trajectory: |
      Capital accumulation through custodial fintech ventures emerges once the
      native invests in gemstone-backed ledgers referenced by Bhrigu.
    window: "Years 32-60"
    certainty: 0.8
  - id: FU-40
    tradition: "universal"
    sutra_reference: "Bikaner folio 33f"
    description: |
      Moons rooted in water yet stationed in tech-forward locales drive
      humanitarian innovation according to the folio.
    conditions:
      moon_element:
        any_of: ["water"]
    trajectory: |
      Expect grants for climate-resilient desalination labs and pilgrim
      healthcare drones funded by philanthropic guilds.
    window: "Years 18-40"
    certainty: 0.73
  - id: FU-55
    tradition: "southern-grantha"
    sutra_reference: "Grantha palm 55c"
    description: |
      Ketu in the twelfth with waxing Moon drives contemplative retreats.
      Future instructions focus on pilgrim circuits, dream journaling, and
      moksha-aligned service projects.
    conditions:
      moon_element:
        any_of: ["water", "ether"]
      lunar_tithi:
        min: 8
        max: 14
      ketu_house:
        equals: 12
    trajectory: |
      Expect invitations to lead silence retreats, curate dream circles, and
      mentor seekers on detachment disciplines.
    window: "Years 24-48"
    certainty: 0.74
matchmaking_criteria:
  - id: MM-3
    tradition: "universal"
    sutra_reference: "Sharada palm 77c"
    description: |
      Harmonious lunar elements and synchronized tithis create empathic
      partnerships that Bhrigu recommends for both spiritual and modern
      entrepreneurial households.
    base_weight: 0.6
    pair_rules:
      - label: "Lunar element harmony"
        primary_field: "moon_element"
        partner_field: "moon_element"
        comparator: "harmonious"
        sets:
          - ["water", "earth"]
          - ["fire", "air"]
        weight: 0.6
      - label: "Shared tithi rhythm"
        primary_field: "lunar_tithi"
        partner_field: "lunar_tithi"
        comparator: "distance"
        max_difference: 2
        weight: 0.4
    modern_modifiers:
      remote-first: 0.05
      research-partnership: 0.04
  - id: MM-8
    tradition: "southern-grantha"
    sutra_reference: "Grantha scroll 18d"
    description: |
      Venus stewardship and Mars missions must complement to support Bhrigu's
      "digital grihastha" households that balance art, finance, and product
      roadmaps.
    base_weight: 0.4
    pair_rules:
      - label: "Venus treasury sync"
        primary_field: "venus_house"
        partner_field: "venus_house"
        comparator: "distance"
        max_difference: 1
        circular: true
        weight: 0.5
      - label: "Mars mission complement"
        primary_field: "mars_house"
        partner_field: "mars_house"
        comparator: "distance"
        max_difference: 3
        weight: 0.5
    modern_modifiers:
      startup-ops: 0.07
      arts-collab: 0.05
  - id: MM-15
    tradition: "northern"
    sutra_reference: "Kashi scroll 15b"
    description: |
      Jupiter-Mercury pairings in the fifth bhava strengthen joint study and
      translation work across families.
    base_weight: 0.55
    pair_rules:
      - label: "Scholarship tandem"
        primary_field: "mercury_house"
        partner_field: "mercury_house"
        comparator: "distance"
        max_difference: 2
        circular: true
        weight: 0.35
      - label: "Jupiter wisdom sync"
        primary_field: "jupiter_house"
        partner_field: "jupiter_house"
        comparator: "distance"
        max_difference: 2
        circular: true
        weight: 0.65
    modern_modifiers:
      research-partnership: 0.06
      multi-lingual: 0.05
