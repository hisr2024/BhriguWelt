# ===========================================
# BhriguWelt Automated Backup Cron Configuration
# ===========================================
#
# Installation:
#   1. Copy this file to /etc/cron.d/bhriguwelt-backup
#   2. Ensure backup.sh has execute permissions: chmod +x /app/backend/scripts/backup.sh
#   3. Restart cron: service cron restart
#
# ===========================================

# Environment variables
SHELL=/bin/bash
PATH=/usr/local/sbin:/usr/local/bin:/sbin:/bin:/usr/sbin:/usr/bin
BACKUP_DIR=/app/backups
DATABASE_URL=sqlite:///./bhriguwelt.db
BACKUP_RETENTION_DAYS=30

# Daily backup at 2:00 AM
0 2 * * * root /app/backend/scripts/backup.sh >> /var/log/bhriguwelt-backup.log 2>&1

# Weekly full backup on Sunday at 3:00 AM
0 3 * * 0 root BACKUP_DIR=/app/backups/weekly /app/backend/scripts/backup.sh >> /var/log/bhriguwelt-backup.log 2>&1

# Monthly backup on the 1st at 4:00 AM
0 4 1 * * root BACKUP_DIR=/app/backups/monthly BACKUP_RETENTION_DAYS=365 /app/backend/scripts/backup.sh >> /var/log/bhriguwelt-backup.log 2>&1
