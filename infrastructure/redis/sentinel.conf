# Redis Sentinel Configuration for High Availability
# BhriguWelt Production Setup

# Network Configuration
port 26379
daemonize no
loglevel notice
logfile ""

# Sentinel Configuration
sentinel monitor bhriguwelt-master redis-master 6379 2
sentinel down-after-milliseconds bhriguwelt-master 5000
sentinel parallel-syncs bhriguwelt-master 1
sentinel failover-timeout bhriguwelt-master 60000

# Authentication (set via environment variable)
# sentinel auth-pass bhriguwelt-master ${REDIS_PASSWORD}

# Notification Scripts (optional)
# sentinel notification-script bhriguwelt-master /path/to/notification.sh
# sentinel client-reconfig-script bhriguwelt-master /path/to/reconfig.sh

# Sentinel announce configuration for Docker/Kubernetes
# sentinel announce-ip will be set via environment
# sentinel announce-port 26379

# Security
protected-mode no

# Performance
sentinel deny-scripts-reconfig yes
