service: bhriguwelt-backend
frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs18.x
  stage: ${opt:stage, 'prod'}
  region: ${opt:region, 'us-east-1'}
  memorySize: 512
  timeout: 15
  httpApi:
    cors: true
  environment:
    NODE_OPTIONS: "--enable-source-maps"

functions:
  api:
    handler: backend/src/handlers/api.handler
    description: Primary BhriguWelt API handler
    events:
      - httpApi:
          path: /{proxy+}
          method: '*'

  fallback:
    handler: backend/src/handlers/fallback.handler
    description: Fallback handler used for degraded mode responses
    events:
      - httpApi:
          path: /fallback
          method: '*'

package:
  patterns:
    - backend/**
    - '!backend/node_modules/**'

plugins: []
