global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: "cloudwatch-exporter"
    static_configs:
      - targets: ["cloudwatch-exporter:9106"]

  - job_name: "bhriguwelt-backend"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["bhriguwelt-backend:4000"]
