services:
  - type: web
    name: bhriguwelt-backend
    env: python
    rootDir: backend
    pythonVersion: 3.11
    plan: free
    buildCommand: python -m pip install -r requirements.txt  # Changed from 'pip install'
    startCommand: PYTHONPATH=src python -m bhriguwelt.api
    envVars:
      - key: PYTHONPATH
        value: src
    healthCheckPath: /health
    autoDeploy: true
