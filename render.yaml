services:
  - type: web
    name: bhriguwelt-backend
    env: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: PYTHONPATH=src python -m bhriguwelt.api
    envVars:
      - key: PYTHONPATH
        value: src
    healthCheckPath: /health
    autoDeploy: true
